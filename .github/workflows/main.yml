name: Update GitHub Stats

on:
  schedule:
    # Runs every day at midnight UTC (00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
  contents: write # Use a standard Linux virtual machine

    steps:
      - name: Check out repo
        # This step downloads your repository's code into the virtual machine
        uses: actions/checkout@v3

      - name: Set up Python
        # This step installs Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # You can change this if your script needs a different version

      - name: Install dependencies
        # This step installs the libraries your script needs
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil lxml
          
      - name: Run update script
        # This is the most important step. It runs your Python script.
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }} # This automatically gets your username
        run: |
          python main.py
          
      - name: Commit and push changes
        # This step checks if the script made any changes to the SVG files.
        # If it did, it commits and pushes them back to your repository.
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --staged --quiet || git commit -m "📊 Update GitHub Stats"
          git push
